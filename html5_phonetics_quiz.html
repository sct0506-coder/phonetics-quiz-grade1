<body>
<!-- 觸控螢幕音訊提示（不擋 PLAY）：點擊 PLAY 即自動解鎖，一次完成 -->
<div id="audioUnlockOverlay" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,246,248,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1em 1.2em;pointer-events:none;">
  <p style="font-size:1.1em;margin:.2em 0;color:#e05272;font-weight:700">🔊 觸控螢幕提示：直接點下方 PLAY 即可（已自動處理音訊解鎖）</p>
  <button id="audioUnlockBtnInside" style="background:#ff6b8a;color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;font-size:1em;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,138,.4);min-width:220px;pointer-events:auto">👆 測試音效（可選）</button>
  <p id="audioUnlockStatusInside" style="color:#888;margin-top:.4em;font-size:.85em;pointer-events:auto"></p>
</div>
<script>
// 觸控解鎖：HTML5 <audio> 需在同一 document 取得使用者手勢，此腳本提供永久解鎖 + 測試 + TTS 備援
(function(){
  const overlay=document.getElementById('audioUnlockOverlay');
  const btn=document.getElementById('audioUnlockBtnInside');
  const status=document.getElementById('audioUnlockStatusInside');
  let unlocked=false, audioCtx=null;
  // 建立並保持一個共用 AudioContext，觸控後永久保持 resume
  function getCtx(){
    if(audioCtx) return audioCtx;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
    return audioCtx;
  }
  async function unlock(){
    if(unlocked) status.textContent='✅ 已啟用，再次測試中…';
    try{
      const ctx=getCtx();
      if(ctx && ctx.state==='suspended') await ctx.resume();
      if(ctx){
        const buf=ctx.createBuffer(1,1,22050);
        const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);
      }
      // 1) 試播本地音效（音量正常以便聽見）
      const a=document.createElement('audio');
      a.src='assets/sound_click.mp3';
      a.volume=0.8;
      await a.play();
      // 播放成功代表已解鎖，2秒後自動隱藏
      status.innerHTML='✅ 音訊已啟用！<br><small>若仍無聲，請檢查觸控螢幕喇叭/音量鍵，或點「測試發音」</small>';
      a.onended=()=>{a.remove();};
      setTimeout(()=>{ try{a.pause(); a.remove();}catch(e){} },800);
      // 2) 猴補丁：攔截後續所有 <audio>.play，確保先 resume
      if(!HTMLAudioElement.prototype._patched){
        const origPlay=HTMLAudioElement.prototype.play;
        HTMLAudioElement.prototype.play=function(){
          if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{});
          return origPlay.call(this);
        };
        HTMLAudioElement.prototype._patched=true;
      }
      // 3) 若遊戲已載入，預熱其原有音效函式
      try{
        if(window.kf && window.lf && window.sound_click_mp3){
          const t=window.kf(window.lf(window.sound_click_mp3));
          t.volume=0.6; t.play().catch(()=>{}); setTimeout(()=>{try{t.pause();}catch(e){}},600);
        }
        // 解鎖現存 audio 標籤
        document.querySelectorAll('audio').forEach(el=>{ el.muted=false; });
      }catch(e){}
      unlocked=true;
      btn.textContent='✅ 已啟用 - 點此測試發音';
      // 4) TTS 備援：若 Google TTS 被擋，改用 Web Speech API
      if(!window._ttsPatched && window.speechSynthesis){
        window._ttsPatched=true;
        const origF=window.Ff;
        // 在遊戲載入後才有 Ff，先輪詢
        const tryPatch=()=>{
          if(typeof window.Ff==='function'){
            const old=window.Ff;
            window.Ff=function(a){
              const r=old.apply(this,arguments);
              // 監聽播放失敗時用 speechSynthesis 補救
              setTimeout(()=>{
                try{
                  const snd=window.questionSound;
                  if(snd && snd.error){ throw new Error('tts error'); }
                }catch(e){
                  try{
                    const u=new SpeechSynthesisUtterance(a);
                    u.lang='zh-TW'; u.rate=0.9;
                    speechSynthesis.speak(u);
                    status.textContent='🔊 已改用系統語音朗讀';
                  }catch(e2){}
                }
              },400);
              return r;
            };
          } else setTimeout(tryPatch,500);
        };
        tryPatch();
      }
      // 點擊後 1.2 秒自動隱藏遮罩（保留按鈕可再次測試）
      setTimeout(()=>{ overlay.style.display='none'; }, 1200);
    }catch(e){
      console.log('unlock err',e);
      status.innerHTML='⚠️ 仍未成功：'+(e.message||e)+'<br><small>請確認已調高音量、未靜音，並再點一次；若用 Padlet 嵌入，請改用「全螢幕開啟」</small>';
      // 嘗試改用 Web Speech 測試
      try{ const u=new SpeechSynthesisUtterance('音訊測試'); u.lang='zh-TW'; speechSynthesis.speak(u); status.textContent+='（已嘗試系統語音）'; }catch(e2){}
    }
  }
  // 測試按鈕：已解鎖後再次點擊可重播測試
  btn.addEventListener('click', unlock);
  btn.addEventListener('touchend', (e)=>{ e.preventDefault(); unlock(); }, {passive:false});
  window.addEventListener('message', (e)=>{
    if(e.data==='unlockAudio' || (e.data && e.data.type==='unlockAudio')) unlock();
  });
  // 任意觸控也嘗試解鎖
  overlay.addEventListener('touchend', (e)=>{ if(!unlocked) unlock(); }, {passive:true});
  // 攔截所有 touchstart 嘗試 resume（確保後續點擊不再被擋）
  document.addEventListener('touchstart', ()=>{ const c=getCtx(); if(c && c.state==='suspended') c.resume().catch(()=>{}); }, {passive:true});
})();
</script>
    	<script type="text/javascript">
		(function(name,callback){

			var getObjectByName = function(name, opt_obj) {
				var parts = name.split('.');
				var cur = opt_obj || window;
				for (var part; part = parts.shift(); ) {
					if (cur[part]) {
						cur = cur[part];
					} else {
						return null;
					}
				}
				return cur;
			};

			function loadJS(call){
				var script = document.createElement('script');
				script.setAttribute('type','text/javascript');
				script.onload = function(){
					(getObjectByName(callback))();
					call();
				};

				script.setAttribute('src',name);
				document.getElementsByTagName('head')[0].appendChild(script);
			}

			var webappCache = window.applicationCache;

			if(webappCache && window.navigator.userAgent.indexOf('WebKit') != -1){

				var WIDTH = 200,
					HEIGHT = 100;

				var scripts = document.getElementsByTagName('script');
				var script = scripts[scripts.length-1];
				var el = document.createElement('div');
				var parent = script.parentNode;
				if(parent.style.position!='absolute' && parent.style.position!='relative'){
					parent.style.cssText = 'relative';
				}
				var pwidth = window.innerWidth;
				var pheight = window.innerHeight;
				el.style.cssText = 'text-align:center;width:'+WIDTH+'px;height:'+HEIGHT+'px;position:absolute;left:'+Math.round((pwidth-WIDTH)*.5)+'px;top:'+Math.round((pheight-HEIGHT)*.5)+'px';
				script.parentNode.insertBefore(el,script);
				script.parentNode.removeChild(script);

				var started = 0;

				var close = function(){
					if(started) return;
					el.innerHTML = 'Starting';
					loadJS(function(){
						el.parentNode.removeChild(el);
					});
					started=1;
					clearTimeout(timeout);
				};

				var timeout = setTimeout(function(){close()},3000);

				webappCache.addEventListener('checking', function(){
					//console.log('checking');
					el.innerHTML = 'Initializing';
					},false);

				webappCache.addEventListener('cached', function(){
					//console.log('cached');
					close();
				},false);

				webappCache.addEventListener('noupdate', function(){
					//console.log('noupdate');
					close();
				},false);

				webappCache.addEventListener('updateready', function(){
					//console.log('updateready');
					webappCache.swapCache();
					close();
				},false);
/*
			webappCache.addEventListener('downloading', function(){
					clearTimeout(timeout);
				},false);

				webappCache.addEventListener('progress', function(e){
					console.log('progress '+e.loaded+'/'+e.total);
					el.innerHTML = 'Loading '+e.loaded+'/'+e.total;
				},false);
*/
				webappCache.addEventListener('obsolete', function(){
					//console.log('obsolete')
					close();
				}, false);

				webappCache.addEventListener('error', function(e){
					//console.log('error');
					close();
				}, false);
			}
			else {
				loadJS(function(){});
			}

		})('phonetics_quiz.js','phonetics_quiz.start');

		</script>
</body>
