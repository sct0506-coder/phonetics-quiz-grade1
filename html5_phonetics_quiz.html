<!-- 觸控螢幕音訊解鎖遮罩：HTML5 遊戲需使用者手勢才能播放聲音 -->
<div id="audioUnlockOverlay" style="position:fixed;inset:0;z-index:9999;background:rgba(255,246,248,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2em;">
  <p style="font-size:1.4em;margin:.4em 0;color:#e05272;font-weight:700">🔊 觸控螢幕請先啟用音訊</p>
  <p style="color:#666;margin:.2em 0 1em">點擊下方按鈕後，注音朗讀與答題音效才會正常播放</p>
  <button id="audioUnlockBtnInside" style="background:#ff6b8a;color:#fff;border:0;border-radius:999px;padding:.9em 2em;font-size:1.25em;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,138,.4);min-width:260px;min-height:56px">👆 點擊啟用音訊並開始</button>
  <p id="audioUnlockStatusInside" style="color:#888;margin-top:.8em;font-size:.9em"></p>
</div>
<script>
// 觸控解鎖：在此頁面內建立 AudioContext / <audio> 手勢，確保後續 kf()/of() 可播放
(function(){
  const overlay=document.getElementById('audioUnlockOverlay');
  const btn=document.getElementById('audioUnlockBtnInside');
  const status=document.getElementById('audioUnlockStatusInside');
  let unlocked=false;
  async function unlock(){
    if(unlocked) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        const ctx=new AC();
        if(ctx.state==='suspended') await ctx.resume();
        const buf=ctx.createBuffer(1,1,22050);
        const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);
        setTimeout(()=>{try{ctx.close();}catch(e){}},600);
      }
      // 試播一個極小聲音以解鎖 <audio> 自動播放限制
      const a=document.createElement('audio'); a.src='assets/sound_click.mp3'; a.volume=0.02;
      a.play().then(()=>{ setTimeout(()=>{a.pause(); a.remove();},300); }).catch(()=>{});
      // 解鎖已存在的 audio 元素（若遊戲已載入）
      document.querySelectorAll('audio').forEach(el=>{ el.muted=false; el.play().catch(()=>{}); el.pause(); });
      // 若有全域函式 of/kf，也嘗試預熱
      try{ if(window.kf && window.lf && window.sound_click_mp3){ const t=window.kf(window.lf(window.sound_click_mp3)); t.volume=0.01; t.play().catch(()=>{}); setTimeout(()=>{try{t.pause();}catch(e){}},300);} }catch(e){}
    }catch(e){ console.log('unlock err',e); }
    unlocked=true;
    status.textContent='✅ 音訊已啟用，開始遊戲…';
    btn.textContent='✅ 已啟用';
    setTimeout(()=>{ overlay.style.display='none'; }, 500);
  }
  btn.addEventListener('click', unlock);
  btn.addEventListener('touchend', unlock, {passive:true});
  // 父頁面 (index.html) 的解鎖按鈕可透過 postMessage 觸發此頁解鎖
  window.addEventListener('message', (e)=>{
    if(e.data==='unlockAudio' || (e.data && e.data.type==='unlockAudio')) unlock();
  });
  // 若使用者在遮罩外任意點擊也嘗試解鎖（提升體驗）
  overlay.addEventListener('touchend', unlock, {passive:true});
})();
</script>
    	<script type="text/javascript">
		(function(name,callback){

			var getObjectByName = function(name, opt_obj) {
				var parts = name.split('.');
				var cur = opt_obj || window;
				for (var part; part = parts.shift(); ) {
					if (cur[part]) {
						cur = cur[part];
					} else {
						return null;
					}
				}
				return cur;
			};

			function loadJS(call){
				var script = document.createElement('script');
				script.setAttribute('type','text/javascript');
				script.onload = function(){
					(getObjectByName(callback))();
					call();
				};

				script.setAttribute('src',name);
				document.getElementsByTagName('head')[0].appendChild(script);
			}

			var webappCache = window.applicationCache;

			if(webappCache && window.navigator.userAgent.indexOf('WebKit') != -1){

				var WIDTH = 200,
					HEIGHT = 100;

				var scripts = document.getElementsByTagName('script');
				var script = scripts[scripts.length-1];
				var el = document.createElement('div');
				var parent = script.parentNode;
				if(parent.style.position!='absolute' && parent.style.position!='relative'){
					parent.style.cssText = 'relative';
				}
				var pwidth = window.innerWidth;
				var pheight = window.innerHeight;
				el.style.cssText = 'text-align:center;width:'+WIDTH+'px;height:'+HEIGHT+'px;position:absolute;left:'+Math.round((pwidth-WIDTH)*.5)+'px;top:'+Math.round((pheight-HEIGHT)*.5)+'px';
				script.parentNode.insertBefore(el,script);
				script.parentNode.removeChild(script);

				var started = 0;

				var close = function(){
					if(started) return;
					el.innerHTML = 'Starting';
					loadJS(function(){
						el.parentNode.removeChild(el);
					});
					started=1;
					clearTimeout(timeout);
				};

				var timeout = setTimeout(function(){close()},3000);

				webappCache.addEventListener('checking', function(){
					//console.log('checking');
					el.innerHTML = 'Initializing';
					},false);

				webappCache.addEventListener('cached', function(){
					//console.log('cached');
					close();
				},false);

				webappCache.addEventListener('noupdate', function(){
					//console.log('noupdate');
					close();
				},false);

				webappCache.addEventListener('updateready', function(){
					//console.log('updateready');
					webappCache.swapCache();
					close();
				},false);
/*
			webappCache.addEventListener('downloading', function(){
					clearTimeout(timeout);
				},false);

				webappCache.addEventListener('progress', function(e){
					console.log('progress '+e.loaded+'/'+e.total);
					el.innerHTML = 'Loading '+e.loaded+'/'+e.total;
				},false);
*/
				webappCache.addEventListener('obsolete', function(){
					//console.log('obsolete')
					close();
				}, false);

				webappCache.addEventListener('error', function(e){
					//console.log('error');
					close();
				}, false);
			}
			else {
				loadJS(function(){});
			}

		})('phonetics_quiz.js','phonetics_quiz.start');

		</script>
</body>
